name: Campaign reset browser regression
on:
  pull_request:
    paths: ['index.html', 'js/**', 'scripts/**', '.github/workflows/reset-browser.yml']
permissions:
  contents: read
jobs:
  browser-reset:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.55.0
      - run: |
          # Wait for another apt process (a fresh runner often has one) instead of failing on its lock.
          echo 'DPkg::Lock::Timeout "240";' | sudo tee /etc/apt/apt.conf.d/99-lock-timeout >/dev/null
          for i in 1 2 3; do
            timeout 300 python -m playwright install --with-deps chromium && break
            [ "$i" = 3 ] && exit 1
            sleep 5
          done
      - run: |
          python -m http.server 4188 > /tmp/server.log 2>&1 &
          python scripts/verify-campaign-reset-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reset-browser-evidence
          path: browser-evidence
