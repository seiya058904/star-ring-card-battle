name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to rebuild and update (for example v1.2.4)"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 手动重建既有 release 时必须 checkout 输入的 tag 本身，
          # 保证 Release APK 与 tag 源码一一对应，而不是在当前 main 上构建后覆盖旧 Release。
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Run canonical verification firewall
        shell: bash
        run: |
          set -euo pipefail
          for file in js/*.js scripts/*.mjs; do
            node --check "$file"
          done
          node scripts/verify-all.mjs
          git diff --check

      - name: Resolve release tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            RELEASE_TAG="${{ github.event.inputs.release_tag }}"
          fi
          if [ -z "$RELEASE_TAG" ]; then
            echo "release_tag input is required for workflow_dispatch" >&2
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Verify tag and version consistency
        shell: bash
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG#v}"
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle | head -1)"
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' android/app/build.gradle | head -1)"
          if [ "$TAG" != "$VERSION_NAME" ]; then
            echo "Tag v${TAG} does not match versionName ${VERSION_NAME}" >&2
            exit 1
          fi
          if ! [ "$VERSION_CODE" -gt 0 ] 2>/dev/null; then
            echo "versionCode must be a positive integer" >&2
            exit 1
          fi
          # 新版本发布（tag push）：versionCode 必须严格递增，防止覆盖更新时被系统拒绝。
          # 重建既有 Release（workflow_dispatch）：构建的是历史 tag 源码，其 versionCode
          # 必然小于等于后续版本，不能再与未来版本比较大小；只校验 tag / versionName /
          # versionCode 与该 tag 源码自洽。
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "Rebuild of existing release ${RELEASE_TAG}: skipping monotonic versionCode check (tag/versionName/versionCode consistency verified: versionCode=${VERSION_CODE})."
            exit 0
          fi
          GITHUB_REF_NAME_VALUE="${GITHUB_REF_NAME:-}"
          MAX_PREV=0
          for tag in $(git tag --list 'v[0-9]*' --sort=version:refname); do
            if [ "$tag" = "$GITHUB_REF_NAME_VALUE" ] || [ "$tag" = "$RELEASE_TAG" ]; then continue; fi
            prev="$(git show "$tag:android/app/build.gradle" 2>/dev/null | sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' | head -1)"
            if [ -n "$prev" ] && [ "$prev" -gt "$MAX_PREV" ]; then MAX_PREV="$prev"; fi
          done
          if [ "$VERSION_CODE" -le "$MAX_PREV" ]; then
            echo "versionCode ${VERSION_CODE} must be greater than previous max ${MAX_PREV}" >&2
            exit 1
          fi
          echo "Tag/version OK: v${TAG} versionName=${VERSION_NAME} versionCode=${VERSION_CODE} previousMax=${MAX_PREV}"

      - name: Reconstruct debug signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo "Missing required secret ANDROID_DEBUG_KEYSTORE_BASE64" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/android-debug.keystore"

      - name: Build debug APK with stable signing identity
        working-directory: android
        shell: bash
        env:
          ANDROID_DEBUG_KEYSTORE: ${{ runner.temp }}/android-debug.keystore
          ANDROID_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
          ANDROID_DEBUG_KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
          ANDROID_DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK signature
        shell: bash
        env:
          EXPECTED_SHA256: ${{ vars.ANDROID_DEBUG_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "$APK"
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*SHA-256 digest: //p' | tr -d ':' | tr 'A-F' 'a-f')"
          EXPECTED="$(printf '%s' "$EXPECTED_SHA256" | tr -d ':' | tr 'A-F' 'a-f')"
          if [ -z "$EXPECTED" ]; then
            echo "Missing required repository variable ANDROID_DEBUG_CERT_SHA256" >&2
            exit 1
          fi
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "APK certificate fingerprint does not match expected certificate" >&2
            exit 1
          fi
          echo "APK signature verified: $ACTUAL"

      - name: Rename release APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "star-ring-card-battle-v${VERSION}.apk"

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: star-ring-card-battle-v*.apk

      - name: Upload APK to existing release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" "star-ring-card-battle-v${VERSION}.apk" --clobber
